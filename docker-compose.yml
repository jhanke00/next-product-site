version: '3.8'

services:
  # Next.js Application
  nextjs-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: next-product-site
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      # Mount data directory for persistent JSON storage
      - ./src/data:/app/src/data
      # Mount public directory for media files
      - ./public:/app/public
    networks:
      - learning-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development Database (Optional - for future database integration)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: learning-postgres
  #   environment:
  #     POSTGRES_DB: learning_resources
