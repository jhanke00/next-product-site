  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
  #   ports:
  #     - "5432:5432"
  #   networks:
  #     - learning-network
  #   restart: unless-stopped

  # Redis for caching (Optional - for future caching integration)
  # redis:
  #   image: redis:7-alpine
  #   container_name: learning-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - learning-network
  #   restart: unless-stopped
  #   command: redis-server --appendonly yes

  # Nginx reverse proxy (Optional - for production deployment)
  # nginx:
  #   image: nginx:alpine
  #   container_name: learning-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf
  #     - ./nginx/ssl:/etc/nginx/ssl
  #   depends_on:
  #     - nextjs-app
  #   networks:
  #     - learning-network
  #   restart: unless-stopped

networks:
  learning-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
