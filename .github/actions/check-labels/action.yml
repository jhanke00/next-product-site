name: Check PR Labels
description: Fails if none of the required labels are present on a pull request.
inputs:
  required-labels:
    description: Comma-separated list of required labels
    required: true

runs:
  using: 'composite'
  steps:
    - name: Check required labels
      uses: actions/github-script@v7
      with:
        script: |
          const requiredLabels = '${{ inputs.required-labels }}'.split(',').map(l => l.trim().toLowerCase());
          const labels = context.payload.pull_request.labels.map(label => label.name.toLowerCase());

          const hasRequiredLabel = labels.some(label => requiredLabels.includes(label));

          if (!hasRequiredLabel) {
            core.setFailed(`❌ Pull request must have at least one of the required labels: ${requiredLabels.join(', ')}`);
          } else {
            console.log(`✅ PR contains required label(s): ${labels.filter(label => requiredLabels.includes(label)).join(', ')}`);
          }
