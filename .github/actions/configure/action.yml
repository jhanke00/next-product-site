name: Setup Workflow
description: Setup GitHub Action Workflow

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: 'package.json'

    - name: Install PNPM
      uses: pnpm/action-setup@v4.1.0
      id: pnpm-install

    - name: Install Dependencies
      run: pnpm install
      shell: bash
