name: Pull Request

on:
  pull_request:
    types: [opened, synchronize, labeled]
    branches: [main]

env:
  NODE_VERSION: 18.x
  PNPM_VERSION: 8

jobs:
  check-labels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git
        uses: actions/checkout@v4

      - name: Check for required labels
        uses: ./.github/actions/check-labels
        with:
          required-labels: backend, devops, frontend, infrastructure

  build:
    runs-on: ubuntu-latest
    needs: check-labels
    steps:
      - name: Checkout Git
        uses: actions/checkout@v4

      - name: Configure Workflow
        uses: ./.github/actions/configure

      - name: Build Project
        run: pnpm build

  test:
    runs-on: ubuntu-latest
    needs: check-labels
    steps:
      - name: Checkout Git
        uses: actions/checkout@v4

      - name: Configure Workflow
        uses: ./.github/actions/configure

      - name: Run Tests
        run: pnpm test

  lint:
    runs-on: ubuntu-latest
    needs: check-labels
    steps:
      - name: Checkout Git
        uses: actions/checkout@v4

      - name: Configure Workflow
        uses: ./.github/actions/configure

      - name: Run Linter
        run: pnpm lint
